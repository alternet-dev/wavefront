name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  # Force JS actions to Node 24 ahead of GHA's June 2026 default flip. The
  # pinned action majors below haven't published Node-24 tags yet; this env
  # var opts each one in without us tracking version bumps.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY_IMAGE: ghcr.io/alternet-dev/wavefront

jobs:
  # Build the per-arch image on a native runner, push it by digest, and
  # publish the digest as an artifact. arm64 via QEMU is ~20x the native
  # build time; with `ubuntu-24.04-arm` available on public repos, both
  # arches build natively in parallel.
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/alternet-dev/wavefront
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=Edge proxy mapping a versioned external contract onto one internal HTTP/JSON backend
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Stitch the per-arch digests into a single manifest list and tag it.
  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)

  # Publish the wavefront-bundle CLI formula to the alternet-dev Homebrew tap.
  # The formula is source-built (Homebrew compiles it from this tag), so only
  # the tag and its commit need updating — no binaries are uploaded here.
  update-tap:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint tap-write token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: alternet-dev
          repositories: homebrew-tap

      - name: Resolve App bot user id
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Update homebrew-tap formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user-id }}
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/alternet-dev/homebrew-tap.git" \
            tap
          cp packaging/homebrew-wavefront.rb tap/Formula/wavefront.rb
          cd tap
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g; s|REVISION_PLACEHOLDER|${REVISION}|g" Formula/wavefront.rb
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/wavefront.rb
          git diff --staged --quiet && echo "no formula change" && exit 0
          git commit -m "wavefront ${TAG}"
          BRANCH="$(git symbolic-ref --short HEAD)"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/alternet-dev/homebrew-tap.git" \
            HEAD:"${BRANCH}"
